name: Upstream compatibility

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

jobs:
  flowseal:
    name: Latest Flowseal and nfqws2
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: "pip"

      - name: Install converter
        run: python -m pip install .

      - name: Download latest Flowseal release
        shell: pwsh
        run: |
          $release = Invoke-RestMethod -Uri 'https://api.github.com/repos/Flowseal/zapret-discord-youtube/releases/latest'
          $asset = $release.assets | Where-Object { $_.name -like '*.zip' } | Select-Object -First 1
          if (-not $asset) { throw 'Flowseal release has no zip asset' }
          $zip = Join-Path $env:RUNNER_TEMP 'flowseal.zip'
          $dest = Join-Path $env:RUNNER_TEMP 'flowseal'
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zip -UseBasicParsing
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          "FLOWSEAL_DIR=$dest" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Convert every profile and mode
        run: python scripts/check_flowseal.py "$env:FLOWSEAL_DIR" --strict --json compatibility-flowseal.json

      - name: Check nfqws2 configuration contract
        run: python scripts/check_upstream.py

      - name: Upload compatibility report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compatibility-report
          path: compatibility-flowseal.json
          if-no-files-found: warn
